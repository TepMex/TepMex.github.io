id: YSQR_ru
name: Ранние дезадаптивные схемы Джеффри Янга
description: YSQ-R Ранние дезадаптивные схемы Джеффри Янга (усовершенстованный, пересмотренный)

randomize: true

# EDE Emotional Deprivation
# ABA Abandonment
# MIS Mistrust
# SIS Social Isolation
# DEF Defectiveness
# FAL Failure
# DEP Dependence / Incompetence
# VUH Vulnerability to Harm
# EMS Enmeshment
# SJG Subjugation
# SAC Self-Sacrifice
# LOS Fear of Losing Control
# ECO Emotional Constriction
